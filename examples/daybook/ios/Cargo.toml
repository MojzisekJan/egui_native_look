[package]
name = "daybook-ios"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "Daybook"
path = "../../daybook.rs"

[dependencies]
egui_native_look = { path = "../../.." }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

raw-window-handle = "0.6.2"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIView", "UIResponder", "UIKeyboardLayoutGuide", "UILayoutGuide", "UITrackingLayoutGuide", "objc2-core-foundation"] }

[workspace]

[patch.crates-io]
eframe = { path = "../../../vendor/eframe" }
epaint = { path = "../../../vendor/epaint" }
